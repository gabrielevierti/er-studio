<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: Run beside your code: Run, Stop, Restart and Capture on the simulator's own toolbar, in an editor tab next to your files.; Real pixels, real input: Drives the official simulator through its automation API: its framebuffer, its input, your app's logs.; Environment doctor: Checks Node and the Even Hub tooling, and offers to install what's missing.; SDK reference that follows you: Put the caret on a symbol in a .ts or .js file and the reference jumps to that entry.; Consoles as tabs: App console, simulator console, SDK reference and doctor, each its own bottom tab.; One core, every surface: Every panel is served by one core and framed by the extension, so they cannot drift apart."><title>Features: Run beside your code: Run, Stop, Restart and Capture on the simulator's own toolbar, in an editor tab next to your files.; Real pixels, real input: Drives the official simulator through its automation API: its framebuffer, its input, your app's logs.; Environment doctor: Checks Node and the Even Hub tooling, and offers to install what's missing.; SDK reference that follows you: Put the caret on a symbol in a .ts or .js file and the reference jumps to that entry.; Consoles as tabs: App console, simulator console, SDK reference and doctor, each its own bottom tab.; One core, every surface: Every panel is served by one core and framed by the extension, so they cannot drift apart.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M7 4l13 8-13 8z" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Run beside your code</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#8b949e">Run, Stop, Restart and Capture on the simulator's</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#8b949e">own toolbar, in an editor tab next to your files.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Real pixels, real input</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#8b949e">Drives the official simulator through its</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#8b949e">automation API: its framebuffer, its input, your</text><text x="572.0" y="104" class="sans" font-size="13.5" fill="#8b949e">app's logs.</text></g><g><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 179)"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Environment doctor</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#8b949e">Checks Node and the Even Hub tooling, and offers</text><text x="84.0" y="232" class="sans" font-size="13.5" fill="#8b949e">to install what's missing.</text></g><g><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 179)"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">SDK reference that follows you</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#8b949e">Put the caret on a symbol in a .ts or .js file and</text><text x="572.0" y="232" class="sans" font-size="13.5" fill="#8b949e">the reference jumps to that entry.</text></g><g><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 307)"><path d="M3 5h18v14H3zM7 9l3 3-3 3M12 15h5" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Consoles as tabs</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#8b949e">App console, simulator console, SDK reference and</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#8b949e">doctor, each its own bottom tab.</text></g><g><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 307)"><path d="M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">One core, every surface</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#8b949e">Every panel is served by one core and framed by</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#8b949e">the extension, so they cannot drift apart.</text></g></svg>
